version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      reviewed-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /supporter-service
    schedule:
      interval: weekly
      day: monday
    groups:
      worker-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-patch-updates:
        update-types: [patch]
