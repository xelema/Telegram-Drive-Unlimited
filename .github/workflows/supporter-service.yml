name: Supporter Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'supporter-service/**'
      - '.github/workflows/supporter-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supporter-service/**'
      - '.github/workflows/supporter-service.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after verification'
        required: true
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supporter-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supporter-service/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: supporter-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: supporter-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supporter-service/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply telegram-drive-supporter --remote
      - name: Deploy Worker
        run: npx wrangler deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
