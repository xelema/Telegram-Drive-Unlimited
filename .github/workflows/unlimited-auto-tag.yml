name: "Unlimited auto tag"

# Creates the "v<version>-unlimited" tag for the version in app/package.json
# when main reaches a version that has no tag yet, then starts the
# "Unlimited release" workflow for it.
#
# The upstream sync routine runs in a cloud session whose git proxy refuses tag
# pushes, so the tag is created here instead. A tag pushed with GITHUB_TOKEN
# does not start other workflows, hence the explicit dispatch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unlimited-auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the new version and start the release
    if: github.repository == 'xelema/Telegram-Drive-Unlimited'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create the tag and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version app/package.json)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Cannot read an x.y.z version from app/package.json, received '$version'."
              exit 1
              ;;
          esac
          tag="v${version}-unlimited"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "telegram drive unlimited v${version}"
          git push origin "refs/tags/${tag}"
          gh workflow run unlimited-release.yml --ref "$tag" -f tag="$tag" -f platforms=all -f publish=true
          echo "Created ${tag} on ${GITHUB_SHA} and started Unlimited release."
