name: Dependency assurance

on:
  pull_request:
    paths:
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'supporter-service/package.json'
      - 'supporter-service/package-lock.json'
      - 'app/src-tauri/Cargo.toml'
      - 'app/src-tauri/Cargo.lock'
      - 'deny.toml'
      - 'dependency-policy/**'
      - 'scripts/check-node-licenses.cjs'
      - 'scripts/check-npm-audit.cjs'
      - '.github/workflows/dependency-assurance.yml'
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-assurance:
    name: npm advisories and licenses
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        project: [app, supporter-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.project }}
      - run: node scripts/check-npm-audit.cjs ${{ matrix.project }}
      - run: node scripts/check-node-licenses.cjs ${{ matrix.project }}

  assurance-script-contracts:
    name: Release assurance script contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/test-assurance-scripts.cjs

  rust-assurance:
    name: Rust advisories, licenses, bans, and sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install reviewed cargo-deny release
        run: cargo install cargo-deny --locked --version 0.18.7
      - name: Validate expiring Rust advisory baseline
        run: node scripts/check-rust-advisory-baseline.cjs
      - name: Check dependency policy
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml check --config ../../deny.toml --hide-inclusion-graph
