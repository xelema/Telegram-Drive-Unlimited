name: Product page

on:
  push:
    branches: [main]
    paths:
      - "Docs/**"
      - ".github/workflows/pages.yml"
  # Republish after a desktop release so the secondary updater manifest follows it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp Docs/Telegram-Drive.html _site/index.html
          cp Docs/robots.txt Docs/sitemap.xml _site/
          cp -R Docs/assets _site/assets
          touch _site/.nojekyll

      # Secondary updater endpoint. The manifest is only a pointer: every
      # artifact it names is still verified against the minisign public key
      # embedded in the application, so mirroring it here adds no trust.
      - name: Mirror the signed updater manifest
        run: |
          mkdir -p _site/updates
          manifest="_site/updates/latest.json"
          if curl --fail --silent --show-error --location --max-time 60 \
            "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" \
            --output "${manifest}" \
            && node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(typeof m.version!=="string"||!m.platforms||!Object.keys(m.platforms).length) process.exit(1)' "${manifest}"; then
            echo "Mirrored updater manifest."
          else
            # Never publish a missing or malformed manifest; the primary
            # endpoint remains authoritative.
            rm -f "${manifest}"
            echo "::warning::Updater manifest was not mirrored for this deployment."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
