name: i18n Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run i18n key types check
        run: cd app && node scripts/i18n/generate-key-types.cjs --check

      - name: Validate locale resources
        run: cd app && npm run i18n:validate

      - name: Scan UI literals
        run: cd app && npm run i18n:scan

      - name: Build test
        run: cd app && npm run build
