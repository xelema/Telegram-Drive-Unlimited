name: Desktop sync CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop-sync-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - ".github/workflows/desktop-sync-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Test Rust library and sync invariants
        working-directory: app/src-tauri
        run: cargo test --lib
